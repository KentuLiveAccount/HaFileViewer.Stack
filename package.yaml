name: ha-file-viewer
version: 0.1.0.0
license: MIT
author: "KentuLiveAccount"
extra-source-files: []

library:
  exposed-modules: 
    - HaFileViewer.BidirectionalScanner
    - HaFileViewer.LineCache
    - HaFileViewer.CUILogViewer.ViewState
    - HaFileViewer.CUILogViewer.Operations
  source-dirs: src
  ghc-options: -Wall
  dependencies:
    - base >= 4.9 && < 5
    - bytestring
    - text
    - vector
    - mmap
    - containers
    - time
    - directory
    - brick >= 2.0
    - vty
    

executables:
  cui-log-viewer:
    main: Main.hs
    source-dirs: app/CUILogViewer
    ghc-options: -threaded -rtsopts -with-rtsopts=-N
    dependencies:
      - ha-file-viewer
      - base
      - text
      - brick >= 2.0
      - vty
      - directory

tests:
  ui-systematic-test:
    main: test_ui_systematic.hs
    source-dirs:
      - .
      - app/CUILogViewer
    ghc-options: -threaded -rtsopts -with-rtsopts=-N -Wall
    dependencies:
      - ha-file-viewer
      - base
      - text
      - directory
      - brick >= 2.0
      - vty

  ha-file-viewer-test3:
    main: Spec.hs
    source-dirs: test3
    ghc-options: -threaded -rtsopts -with-rtsopts=-N -Wall
    dependencies:
      - ha-file-viewer
      - base
      - hspec
      - temporary
      - filepath
      - text
      - bytestring
      - mmap


